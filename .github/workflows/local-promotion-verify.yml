name: Local Promotion Verify

on:
  pull_request:
    branches:
      - Local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop promotion source
        run: |
          test "${{ github.head_ref }}" = "develop" || {
            echo "Local promotion must come from develop." >&2
            exit 1
          }

  verify:
    needs: promotion-policy
    uses: ./.github/workflows/shared-verify.yml
