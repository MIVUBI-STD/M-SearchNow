name: Shared Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Repository / backend / frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Verify repository contracts
        run: python tools/verify_repository.py
      - name: Verify backend core
        run: |
          cargo fmt --manifest-path EngineData/Backend/RustCore/Cargo.toml -- --check
          cargo test --locked --manifest-path EngineData/Backend/RustCore/Cargo.toml
          cargo clippy --locked --manifest-path EngineData/Backend/RustCore/Cargo.toml --all-targets -- -D warnings
      - name: Verify Tauri adapter formatting
        run: cargo fmt --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml -- --check
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: EngineData/Frontend/RustApp
        run: npm ci --no-audit --no-fund
      - name: Verify frontend architecture and build
        working-directory: EngineData/Frontend/RustApp
        run: npm run validate:quick

  windows-readiness:
    name: Windows Rust/Tauri compile gate
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify RustCore on Windows
        run: cargo test --locked --manifest-path EngineData/Backend/RustCore/Cargo.toml
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install frontend dependencies on Windows
        working-directory: EngineData/Frontend/RustApp
        run: npm ci --no-audit --no-fund
      - name: Build frontend for Tauri context
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:frontend
      - name: Verify Tauri crate compiles on Windows
        run: cargo check --locked --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Build Windows desktop executable
        run: cargo build --locked --release --manifest-path EngineData/Frontend/RustApp/src-tauri/Cargo.toml
      - name: Smoke launch Windows desktop executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "EngineData/Frontend/RustApp/src-tauri/target/release/searchnow.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "SearchNow exited during the Windows runtime smoke launch with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
      - name: Build Windows NSIS installer
        working-directory: EngineData/Frontend/RustApp
        run: npm run build:installer
      - name: Verify Windows NSIS installer artifact
        shell: pwsh
        run: |
          $installers = Get-ChildItem "EngineData/Frontend/RustApp/src-tauri/target/release/bundle/nsis/*-setup.exe"
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          if ($installers[0].Length -le 0) {
            throw "NSIS installer artifact is empty."
          }
          Write-Host "Installer:" $installers[0].FullName
          Write-Host "Bytes:" $installers[0].Length
      - name: Smoke install, launch, and uninstall NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem "EngineData/Frontend/RustApp/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP "SearchNowLifecycleSmoke"
          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force
          }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -PassThru -Wait
          if ($install.ExitCode -ne 0) {
            throw "NSIS silent install failed with code $($install.ExitCode)."
          }

          $installedExe = Join-Path $installRoot "SearchNow.exe"
          if (!(Test-Path $installedExe)) {
            throw "Installed SearchNow executable was not found at $installedExe."
          }

          $process = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Installed SearchNow exited during lifecycle smoke with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

          $uninstaller = Join-Path $installRoot "uninstall.exe"
          if (!(Test-Path $uninstaller)) {
            throw "NSIS uninstaller was not created."
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/S", "_?=$installRoot") -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS silent uninstall failed with code $($uninstall.ExitCode)."
          }

          Start-Sleep -Seconds 2
          if (Test-Path $installedExe) {
            throw "SearchNow executable remained after silent uninstall."
          }
      - name: Prove NSIS version upgrade preserves SearchNow state
        shell: pwsh
        working-directory: EngineData/Frontend/RustApp
        run: |
          $bundleDir = Resolve-Path "src-tauri/target/release/bundle/nsis"
          $currentInstaller = Get-ChildItem "$bundleDir/*-setup.exe" | Select-Object -First 1
          $currentCopy = Join-Path $env:RUNNER_TEMP "SearchNow-current-setup.exe"
          Copy-Item $currentInstaller.FullName $currentCopy -Force

          npx tauri build --bundles nsis --ci --config '{"version":"0.0.9"}'
          $baselineInstaller = Get-ChildItem "$bundleDir/*-setup.exe" |
            Where-Object { $_.Name -match "0\.0\.9" } |
            Select-Object -First 1
          if ($null -eq $baselineInstaller) {
            throw "Baseline NSIS installer version 0.0.9 was not produced."
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "SearchNowUpgradeSmoke"
          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force
          }

          $baselineInstall = Start-Process -FilePath $baselineInstaller.FullName -ArgumentList @("/S", "/D=$installRoot") -PassThru -Wait
          if ($baselineInstall.ExitCode -ne 0) {
            throw "Baseline NSIS install failed with code $($baselineInstall.ExitCode)."
          }

          $appStateRoot = Join-Path $env:APPDATA "com.halokaryamedia.searchnow"
          New-Item -ItemType Directory -Force -Path $appStateRoot | Out-Null
          $settingsPath = Join-Path $appStateRoot "settings.json"
          $downloadsPath = Join-Path $appStateRoot "downloads.json"

          @'
          {
            "schemaVersion": 1,
            "minecraft": {
              "rootOverride": null,
              "includePreview": true,
              "includeLegacyUwp": true,
              "includeDevelopmentContent": false
            }
          }
          '@ | Set-Content -Path $settingsPath -Encoding utf8

          @'
          {
            "schemaVersion": 1,
            "nextSequence": 2,
            "jobs": [{
              "id": "download-000001",
              "source": {"transport":"fixture","resourceId":"resource-upgrade"},
              "displayName": "Upgrade Fixture",
              "destinationFileName": "upgrade.mcpack",
              "state": "queued",
              "progress": {"downloadedBytes":0,"totalBytes":10},
              "attempt": 0,
              "lastError": null,
              "createdAtMs": 1,
              "updatedAtMs": 1
            }]
          }
          '@ | Set-Content -Path $downloadsPath -Encoding utf8

          $settingsBefore = Get-FileHash $settingsPath -Algorithm SHA256
          $downloadsBefore = Get-FileHash $downloadsPath -Algorithm SHA256

          $upgrade = Start-Process -FilePath $currentCopy -ArgumentList @("/S", "/D=$installRoot") -PassThru -Wait
          if ($upgrade.ExitCode -ne 0) {
            throw "Current NSIS upgrade failed with code $($upgrade.ExitCode)."
          }

          $installedExe = Join-Path $installRoot "SearchNow.exe"
          if (!(Test-Path $installedExe)) {
            throw "SearchNow executable missing after version upgrade."
          }

          $process = Start-Process -FilePath $installedExe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Upgraded SearchNow exited during upgrade smoke with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

          if (!(Test-Path $settingsPath) -or !(Test-Path $downloadsPath)) {
            throw "SearchNow persisted state disappeared during installer upgrade."
          }

          $settingsAfter = Get-FileHash $settingsPath -Algorithm SHA256
          $downloadsAfter = Get-FileHash $downloadsPath -Algorithm SHA256
          if ($settingsBefore.Hash -ne $settingsAfter.Hash) {
            throw "Settings state changed unexpectedly during installer upgrade."
          }
          if ($downloadsBefore.Hash -ne $downloadsAfter.Hash) {
            throw "Download state changed unexpectedly during installer upgrade."
          }

          $uninstaller = Join-Path $installRoot "uninstall.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/S", "_?=$installRoot") -PassThru -Wait
            if ($uninstall.ExitCode -ne 0) {
              throw "Upgrade smoke cleanup uninstall failed with code $($uninstall.ExitCode)."
            }
          }
          Remove-Item $appStateRoot -Recurse -Force -ErrorAction SilentlyContinue
