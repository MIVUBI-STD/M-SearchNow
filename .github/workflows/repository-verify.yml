name: Repository Verify

on:
  push:
    branches:
      - develop
      - Local
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        name: Classify verification scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$base" "$head"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              echo "full=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$base" "$head" || {
              echo "full=true" >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi

          changed="$(git diff --name-only "$base" "$head")"
          if [ -z "$changed" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md)
                ;;
              *)
                echo "full=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$changed"

          echo "full=false" >> "$GITHUB_OUTPUT"

  docs-only:
    name: Documentation / repository contract
    needs: scope
    if: needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Verify repository contracts
        run: python tools/verify_repository.py

  verify:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    uses: ./.github/workflows/shared-verify.yml
