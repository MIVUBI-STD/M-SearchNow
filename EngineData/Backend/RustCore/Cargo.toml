[package]
name = "searchnow-core"
version = "0.1.0"
description = "SearchNow in-process backend core"
authors = ["Halo Karya Media"]
edition = "2021"
rust-version = "1.77"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "=0.17.14"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
url = "=2.5.4"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
